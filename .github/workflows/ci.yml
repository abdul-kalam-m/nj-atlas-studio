name: NJ-Atlas checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Validate recipes
        run: python -m pipeline validate
      - name: Python tests (offline)
        run: python -m pytest -m "not network"
      - name: JavaScript tests
        run: npm test
      - name: Plain-language and library lint
        run: python tools/lint_text.py
