name: Rebuild map copies

# D-037, IMPLEMENTATION_GUIDE.md S2-T2: rebuild the hybrid layers' map copies and upload them to the owner's R2
# bucket. Manual only, and it needs the owner's repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY and R2_BUCKET. Without them the job stops before building anything.
on:
  workflow_dispatch:
    inputs:
      layers:
        description: "Layer IDs to rebuild, space-separated (blank: every hybrid layer)"
        required: false

permissions:
  contents: read

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Stop without the owner's storage secrets
        env:
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: test -n "$BUCKET" || (echo "Add the R2 secrets first (docs/studio/IMPLEMENTATION_GUIDE.md S2-T2)." && exit 1)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Build
        run: |
          ids="${{ github.event.inputs.layers }}"
          if [ -z "$ids" ]; then ids=$(python -c "from pipeline import ROOT; from pipeline.recipes import load_recipes; print(' '.join(r['id'] for r in load_recipes(ROOT) if r['access'] == 'hybrid'))"); fi
          for id in $ids; do python -m pipeline build "$id" && python -m pipeline check "$id"; done
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          python tools/publish_tiles.py
          tail -n +2 build/tiles_manifest.csv | while IFS=, read -r file key bytes; do
            aws s3 cp "$file" "s3://${{ secrets.R2_BUCKET }}/$key" --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          done
